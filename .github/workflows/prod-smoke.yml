name: prod-smoke
on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:
    inputs:
      probe_app_id:
        description: Quote-only fault drill app id (requires operator approval)
        type: string
        default: merchant_openrouter
  repository_dispatch:
    types: [deployed]      # Vercel deploy hook -> repository_dispatch
permissions:
  contents: read
  issues: write
concurrency:
  group: fe-gate-prod-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npm run -s prod-smoke 2>&1 | tee smoke.log
      - name: Checkout quote previews
        if: ${{ !cancelled() && vars.FE_GATE_SYNTHETIC_ENABLED == 'true' }}
        env:
          FE_GATE_PROBE_APP_ID: ${{ inputs.probe_app_id || 'merchant_openrouter' }}
        run: node scripts/payment-probes.mjs
      - name: Alert Feishu
        if: failure()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/notify-feishu.mjs
