# Reusable frontend gate. Called from each app repo's .github/workflows/fe-gate.yml.
name: fe-gate
on:
  workflow_call:
    inputs:
      package-manager: { type: string, default: npm, description: "npm | pnpm | bun" }
      node-version: { type: string, default: "22" }
      install-command: { type: string, default: "" }
      build-command: { type: string, default: "" }
      unit-command: { type: string, default: "", description: "unit/consistency tests, e.g. npm run test:unit" }
      e2e-command: { type: string, default: "npx playwright test --config e2e/pages/playwright.config.ts" }
      working-directory: { type: string, default: "." }
    secrets:
      env-file: { required: false, description: "optional dotenv content for NEXT_PUBLIC_* build vars" }
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: ${{ inputs.working-directory }} } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ inputs.node-version }} }
      - if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
      - if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@v2
      - name: Write env
        if: ${{ env.ENV_FILE != '' }}
        env: { ENV_FILE: ${{ secrets.env-file }} }
        run: printf '%s\n' "$ENV_FILE" > .env.local
      - name: Install
        run: |
          if [ -n "${{ inputs.install-command }}" ]; then ${{ inputs.install-command }};
          elif [ "${{ inputs.package-manager }}" = pnpm ]; then pnpm install --frozen-lockfile;
          elif [ "${{ inputs.package-manager }}" = bun ]; then bun install --frozen-lockfile;
          else npm ci; fi
      - name: Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}
      - name: Unit + consistency checks
        if: inputs.unit-command != ''
        run: ${{ inputs.unit-command }}
      - name: Browser gate
        env: { CI: "1" }
        run: ${{ inputs.e2e-command }}
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ${{ inputs.working-directory }}/playwright-report
            ${{ inputs.working-directory }}/test-results
          retention-days: 7
